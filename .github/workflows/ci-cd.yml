name: Frontend Deploy Safety

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-frontend-safe-to-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # 1. Verify required env keys documented in .env.example
      - name: Verify .env.example has required VITE_ keys
        run: |
          cd frontend
          REQUIRED_KEYS=(
            "VITE_SUPABASE_URL"
            "VITE_SUPABASE_ANON_KEY"
            "VITE_API_URL"
            "VITE_STELLAR_HORIZON"
            "VITE_STELLAR_NETWORK_PASSPHRASE"
            "VITE_SOLO_TREASURY_ACCOUNT"
            "VITE_DUEL_TREASURY_ACCOUNT"
          )
          MISSING=0
          for key in "${REQUIRED_KEYS[@]}"; do
            if ! grep -q "^$key=" .env.example; then
              echo "✗ Missing required key: $key"
              MISSING=$((MISSING+1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo "❌ FAIL: $MISSING required VITE_ keys missing from .env.example"
            exit 1
          fi
          echo "✓ All required VITE_ keys present"

      # 2. Verify frontend .env is NOT committed (only .env.example should be tracked)
      - name: Verify frontend/.env not committed
        run: |
          if git ls-files frontend/.env | grep -q .env; then
            echo "❌ FAIL: frontend/.env is tracked in git!"
            echo "Run: git rm --cached frontend/.env"
            exit 1
          fi
          echo "✓ frontend/.env not tracked in git"

      # 3. Scan frontend source for accidentally committed Stellar secret keys
      - name: Scan for leaked Stellar secret keys
        run: |
          SECRETS_FOUND=$(grep -rE "['\"]S[A-Z0-9]{55}['\"]" frontend/src 2>/dev/null || true)
          if [ -n "$SECRETS_FOUND" ]; then
            echo "❌ FAIL: Possible Stellar secret keys found in frontend source:"
            echo "$SECRETS_FOUND"
            exit 1
          fi
          echo "✓ No Stellar secret keys leaked in frontend"

      # 4. Build the frontend — catches every real deploy error
      - name: Build frontend (verifies safe to deploy to Vercel)
        run: |
          cd frontend
          npm run build
          echo "✓ Frontend builds successfully — safe to deploy to Vercel"
